<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adrian Lee | Aerospace</title>
    <style>
        :root {
            --phosphor: #33ff00; /* Classic terminal green */
            --bg: #050505;
        }
        body {
            background-color: var(--bg);
            color: var(--phosphor);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 2rem;
            overflow: hidden;
        }
        /* CRT Scanline Overlay */
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.2) 50%,
                rgba(0,0,0,0.2)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 50;
        }
        /* Glowing Wireframe Container */
        .terminal-window {
            border: 2px solid var(--phosphor);
            box-shadow: 0 0 10px var(--phosphor), inset 0 0 10px var(--phosphor);
            padding: 20px;
            height: 80vh;
            text-shadow: 0 0 5px var(--phosphor);
            position: relative;
        }
        h1 { 
            text-transform: uppercase; 
            border-bottom: 1px solid var(--phosphor); 
            padding-bottom: 10px;
        }
        a { 
            color: var(--phosphor); 
            text-decoration: none; 
            border: 1px solid var(--phosphor);
            padding: 5px 10px;
            margin-right: 10px;
            transition: all 0.2s;
        }
        a:hover { 
            background-color: var(--phosphor); 
            color: var(--bg); 
            box-shadow: 0 0 15px var(--phosphor);
        }
    </style>
</head>
<body>
    <div class="scanlines"></div>
    <div class="terminal-window">
        <h1>Adrian_Lee.exe</h1>
        <p>> SYSTEM: ONLINE</p>
        <p>> LOCATION: MUNICH_GERMANY</p>
        <p>> ROLE: AEROSPACE_ENGINEERING_MS</p>
        <p>> CURRENT_TASK: FLIGHT_DYNAMIC_MODELING</p>
        <br>
        <p>
            <a href="#">[ LOAD_PROJECTS ]</a> 
            <a href="#">[ VIEW_RESUME ]</a> 
            <a href="#">[ INIT_CONTACT ]</a>
        </p>
    </div>
</body>
</html>
